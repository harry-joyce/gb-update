name: Track language availability

on:
  schedule:
    # Every 30 minutes, at :17 and :47. Deliberately not "*/30", which fires at
    # :00 and :30 -- the most congested minutes on GitHub's scheduler. Two
    # offsets also mean a single dropped slot only costs 30 minutes.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - config.json
      - .github/workflows/track.yml

permissions:
  contents: write

# Never let two runs race on the same data file.
concurrency:
  group: track-languages
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Publisher counts are confidential, so data/weights.json is gitignored
      # and never in the repository. The runner gets it from a secret instead,
      # writing it to disk for this job only. Without the secret the step is a
      # no-op and track.py simply omits the audience figure.
      - name: Provide publisher weights
        env:
          WEIGHTS_B64: ${{ secrets.LANGUAGE_WEIGHTS_B64 }}
        run: |
          if [ -z "$WEIGHTS_B64" ]; then
            echo "No LANGUAGE_WEIGHTS_B64 secret set; audience figure will be omitted."
            exit 0
          fi
          printf '%s' "$WEIGHTS_B64" | base64 -d > data/weights.json

          # Refuse to continue if the file could ever be committed. A run
          # without the figure is a cosmetic loss; leaking the counts is not.
          if ! git check-ignore -q data/weights.json; then
            echo "::error::data/weights.json is not gitignored -- refusing to run." >&2
            rm -f data/weights.json
            exit 1
          fi
          python3 -c "import json; d = json.load(open('data/weights.json')); \
            assert d['publishers'] and d['global_publishers'], 'weights look empty'; \
            print('weights loaded: %d languages' % len(d['publishers']))"

      - name: Check jw.org for newly available languages
        id: track
        run: python3 scripts/track.py

      - name: Record the result
        if: steps.track.outputs.should_commit == 'true'
        run: |
          git config user.name "gb-update-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            git add data/
            if git diff --quiet --cached; then
              echo "Nothing to commit."
              return 0
            fi
            # Both signals go in the message: the watchable count is the
            # headline, and the catalogue count says how far the media library
            # is behind it.
            COUNT=$(python3 -c "import json;print(json.load(open('data/report.json'))['stats']['published_count'])")
            CATALOGUED=$(python3 -c "import json;print(json.load(open('data/report.json'))['stats'].get('catalog_count', 0))")
            if [ -n "$1" ]; then
              git commit -m "$COUNT languages watchable, $CATALOGUED catalogued (+$1)"
            else
              git commit -m "$COUNT languages watchable, $CATALOGUED catalogued"
            fi
            git push
          }

          if commit_and_push "${{ steps.track.outputs.added }}"; then
            exit 0
          fi

          # A rejected push means another run landed first. data/report.json is
          # GENERATED, so it must never be merged or rebased -- both sides
          # rewrite the same lines and the rebase halts on a conflict. Instead
          # discard our commit, take the newer state as the base, and rebuild:
          # the tracker is idempotent, so regenerating reconciles both results.
          for attempt in 1 2 3; do
            echo "Push rejected (attempt $attempt); rebuilding on top of origin."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/track.py
            if commit_and_push ""; then
              exit 0
            fi
          done
          echo "Could not push after 3 rebuild attempts." >&2
          exit 1

name: Verify publish times

# The hourly tracker pins each language's API timestamp, so a later bulk
# rewrite cannot corrupt banked data -- but it would also go unnoticed. This
# job refetches every published language once a day and records any drift. It
# never changes a resolved publish time.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shares the tracker's concurrency group: both write data/report.json.
concurrency:
  group: track-languages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-read every published language's publish time
        id: verify
        run: python3 scripts/verify_times.py

      - name: Record the result
        run: |
          git config user.name "gb-update-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            git add data/report.json
            if git diff --quiet --cached; then
              echo "No verification changes to record."
              return 0
            fi
            DRIFT="${{ steps.verify.outputs.drift }}"
            if [ "${DRIFT:-0}" -gt 0 ]; then
              git commit -m "Verified publish times ($DRIFT drifted)"
            else
              git commit -m "Verified publish times (no drift)"
            fi
            git push
          }

          if commit_and_push; then
            exit 0
          fi

          # data/report.json is generated: never merge it. Reset to the newer
          # upstream state and re-verify against that base instead.
          for attempt in 1 2 3; do
            echo "Push rejected (attempt $attempt); re-verifying on top of origin."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/verify_times.py
            if commit_and_push; then
              exit 0
            fi
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
